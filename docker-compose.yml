services:
  postgres:
    image: postgres:14
    container_name: postgres-server
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mlflow_db
    networks:
      - backend
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio-server
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    networks:
      - backend
    ports:
      - "9000:9000"
      - "9001:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  fastapi:
    build: .
    container_name: fastapi-server
    networks:
      - backend
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://tracking_server:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - MLFLOW_S3_IGNORE_TLS=true
    volumes:
      - ./logs:/app/logs
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - tracking_server

  tracking_server:
    restart: always
    build: .
    networks:
      - backend
    ports:
      - "5000:5000"
    environment:
      - BACKEND_URI=postgresql://postgres:password@postgres:5432/mlflow_db
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
    command: ["mlflow", "server", "--backend-store-uri", "postgresql://postgres:password@postgres:5432/mlflow_db", "--host", "0.0.0.0", "--serve-artifacts", "--artifacts-destination", "s3://mlflow-artifacts", "--allowed-hosts", "*"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  minio_data:

networks:
  backend:
    driver: bridge